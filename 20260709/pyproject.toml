# ============ pyproject.toml ============

# PEP 621：项目元信息
[project]
name = "my-awesome-tool"
version = "0.1.0"
description = "一个非常棒的 Python 工具"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
keywords = ["python", "tool", "awesome"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 运行时依赖
dependencies = [
    "requests>=2.28",
    "pydantic>=2.0",
    "click>=8.0",
]

# PEP 621：可选依赖（extras）
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

# PEP 621：CLI 入口点
[project.scripts]
my-tool = "my_awesome_tool.cli:main"

# PEP 621：GUI 入口点
[project.gui-scripts]
my-tool-gui = "my_awesome_tool.gui:main"

# 构建系统（PEP 517/518）
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 工具配置（统一在这里）
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true